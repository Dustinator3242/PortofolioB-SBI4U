<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio de biologie 12e</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Concept : une lame de microscope. Fond neutre teinté de violet (hématoxyline), accent rose (éosine),
   colonne de navigation à gauche, contenu en panneaux sur la droite. */
:root{
  --bg:#f5f3f8; --surface:#ffffff; --ink:#1d1530; --muted:#6a6080; --line:#ddd6e8;
  --hema:#4b2e83; --eosin:#c93d71; --tint:#ebe4f5; --ph:#fde3ec; --ph-ink:#8f1f4a;
  --on-hema:#ffffff;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15101f; --surface:#1f1830; --ink:#efeaf7; --muted:#a79ebd; --line:#352b4d;
    --hema:#b79cf0; --eosin:#f08ab0; --tint:#2a2142; --ph:#4a1f35; --ph-ink:#ffc2d8; --on-hema:#15101f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15101f; --surface:#1f1830; --ink:#efeaf7; --muted:#a79ebd; --line:#352b4d;
  --hema:#b79cf0; --eosin:#f08ab0; --tint:#2a2142; --ph:#4a1f35; --ph-ink:#ffc2d8; --on-hema:#15101f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6;
  padding-block:0; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0}
a{color:var(--hema)}
a:focus-visible,button:focus-visible,input:focus-visible,[contenteditable="true"]:focus-visible,summary:focus-visible{outline:3px solid var(--eosin);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* En-tête collant */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .brand{font-family:var(--f-display);font-weight:700;font-size:1.02rem;min-width:0;flex:1 1 200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .brand b{color:var(--eosin)}
.status{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.btn{font:600 .9rem var(--f-body);border:1.5px solid var(--hema);background:transparent;color:var(--hema);padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.btn:hover{background:var(--tint)}
.btn[aria-pressed="true"]{background:var(--hema);color:var(--on-hema)}
.btn.small{padding:5px 10px;font-size:.8rem}
.btn.danger{border-color:var(--eosin);color:var(--eosin)}

.shell{max-width:1180px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:32px;padding-block:24px 64px}
@media(min-width:1000px){.shell{grid-template-columns:210px minmax(0,1fr)}}
.side{display:none}
@media(min-width:1000px){
  .side{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;max-height:calc(100vh - 100px);overflow:auto}
}
.side ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.side a{display:block;padding:6px 10px;border-left:3px solid var(--line);text-decoration:none;color:var(--ink);font-size:.92rem}
.side a:hover,.side a.on{border-color:var(--eosin);background:var(--tint)}
.side .mono{margin:0 0 10px 10px}
main{min-width:0;display:grid;gap:56px}
section{scroll-margin-top:84px;min-width:0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px;border-bottom:2px solid var(--hema);padding-bottom:10px}
.sec-head h2{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800}
.sec-head .tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.back{font-size:.82rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:clamp(16px,3vw,28px);min-width:0}
.panel + .panel{margin-top:18px}
.panel h3{font-size:1.25rem;margin-bottom:4px}
.panel .kicker{display:block;margin-bottom:10px}

/* Accueil */
.hero{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.hero h1{font-size:clamp(2.3rem,7vw,4.2rem);font-weight:800;margin:10px 0 14px}
.hero h1 .ed{display:block}
.hero p{max-width:52ch;margin:0 0 10px;color:var(--muted)}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:6px;position:relative;overflow:hidden;min-width:0}
.slide::before{content:"";display:block;height:56px;background:
  radial-gradient(60px 30px at 18% 60%,var(--eosin) 0,transparent 70%),
  radial-gradient(80px 34px at 52% 40%,var(--hema) 0,transparent 72%),
  radial-gradient(50px 26px at 86% 62%,var(--eosin) 0,transparent 70%);opacity:.55;border-bottom:1px solid var(--line)}
.slide .inner{padding:14px 16px 16px}
.check{list-style:none;margin:0;padding:0;display:grid;gap:0}
.check li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.check li:first-child{border-top:0}
.check input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--hema)}
.check .t{font-weight:600}
.check .t a{text-decoration:none;color:var(--ink)}
.check .t a:hover{color:var(--hema);text-decoration:underline}
.check .sub{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:.84rem;margin-top:2px}
.check .due{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.04em}
.check .due.late{color:var(--eosin);font-weight:500}

/* Contenu modifiable */
.ed{outline:none;border-radius:4px;min-width:0}
body.editing .ed{outline:1.5px dashed var(--line);outline-offset:3px;cursor:text}
body.editing .ed:hover{outline-color:var(--hema)}
.ph{background:var(--ph);color:var(--ph-ink);border-radius:3px;padding:0 3px}
.hint{display:none;background:var(--tint);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:.9rem;margin-bottom:22px}
body.editing .hint{display:block}
.fields{display:grid;gap:14px;margin:0}
.fields > div{display:grid;gap:3px;min-width:0}
.fields dt{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fields dd{margin:0;min-width:0}
.fields ul,.ed ul{margin:0;padding-left:1.2em}
.fields li{margin:2px 0}
.cols{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.cols{grid-template-columns:minmax(0,1fr) 190px}}
.slot{display:grid;gap:8px;align-content:start}
.slot .frame{aspect-ratio:4/5;max-width:100%;background:var(--tint);border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:.82rem;text-align:center;padding:8px}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot input[type=file]{display:none}
.slot .acts{display:none;gap:6px;flex-wrap:wrap}
body.editing .slot .acts{display:flex}
.sublinks{display:flex;gap:6px 14px;flex-wrap:wrap;margin:-6px 0 18px;font-size:.9rem}

/* Lettres */
.letter{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:clamp(20px,5vw,56px);max-width:760px;font-size:1.02rem;box-shadow:0 1px 0 var(--line)}
.letter p{margin:0 0 14px}
.letter .meta{margin-bottom:22px;color:var(--muted);font-size:.95rem}
.letter .sig{margin-top:22px}

/* Cartes */
.mapwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.mapwrap svg{display:block;min-width:820px;width:100%;height:auto}
.mapcap{margin-top:8px}
svg .edge{stroke:var(--muted);stroke-width:1.2;fill:none;opacity:.75}
svg .elabel{font:500 10.5px var(--f-body);fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round;text-anchor:middle}
svg .nbox{fill:var(--tint);stroke:var(--hema);stroke-width:1.2}
svg .ntxt{font:600 12.5px var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
svg .hub .nbox{fill:var(--hema);stroke:var(--hema)}
svg .hub .ntxt{fill:var(--on-hema)}
svg marker path{fill:var(--muted)}

/* Collage */
.collage{columns:3 220px;column-gap:14px}
.tile{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 8px 10px;margin:0 0 14px;display:grid;gap:6px}
.tile:nth-child(3n+1){transform:rotate(-.6deg)}
.tile:nth-child(3n+2){transform:rotate(.5deg)}
.tile img{width:100%;display:block;border-radius:3px}
.tile input[type=text]{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.88rem;padding:3px 0}
.tile input.d{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.tile .rm{display:none}
body.editing .tile .rm{display:inline-flex}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:34px 20px;text-align:center;color:var(--muted)}
.bib h3{font-size:1.1rem;margin:18px 0 6px}
.bib p{margin:6px 0}
footer{margin-top:20px;color:var(--muted);font-size:.84rem}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{.top,.side,.hint{display:none}}
#editBtn,.slot .acts,#addPhotos,.hint{display:none!important}
.tile .rm{display:none!important}
</style>

function layout(nodes, edges, W, H){
  var n=nodes.length, idx={}; nodes.forEach(function(s,i){ idx[s]=i; });
  var P=nodes.map(function(s,i){ var a=i/n*Math.PI*2; return {x:W/2+Math.cos(a)*W*0.36, y:H/2+Math.sin(a)*H*0.36, w:s.length*7.1+28, h:30, dx:0, dy:0, deg:0}; });
  var E=edges.map(function(e){ var a=idx[e[0]], b=idx[e[1]]; P[a].deg++; P[b].deg++; return [a,b,e[2]]; });
  var iters=600, i,j,k;
  for(k=0;k<iters;k++){
    var t=1-k/iters;
    for(i=0;i<n;i++) for(j=i+1;j<n;j++){
      var dx=P[j].x-P[i].x, dy=P[j].y-P[i].y, d2=dx*dx+dy*dy+0.5, d=Math.sqrt(d2), f=14000/d2;
      P[i].dx-=dx/d*f; P[i].dy-=dy/d*f; P[j].dx+=dx/d*f; P[j].dy+=dy/d*f;
    }
    E.forEach(function(e){
      var a=P[e[0]], b=P[e[1]], dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)+0.01, f=(d-190)*0.03;
      a.dx+=dx/d*f; a.dy+=dy/d*f; b.dx-=dx/d*f; b.dy-=dy/d*f;
    });
    P.forEach(function(p){
      p.dx+=(W/2-p.x)*0.01; p.dy+=(H/2-p.y)*0.012;
      var m=Math.sqrt(p.dx*p.dx+p.dy*p.dy), lim=26*t+1; if(m>lim){ p.dx=p.dx/m*lim; p.dy=p.dy/m*lim; }
      p.x+=p.dx; p.y+=p.dy; p.dx=0; p.dy=0;
    });
  }
  function fit(){
    var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    P.forEach(function(p){ x0=Math.min(x0,p.x-p.w/2); x1=Math.max(x1,p.x+p.w/2); y0=Math.min(y0,p.y-p.h/2); y1=Math.max(y1,p.y+p.h/2); });
    var pad=26, sx=(W-2*pad-0)/(x1-x0), sy=(H-2*pad)/(y1-y0);
    P.forEach(function(p){ p.x=pad+(p.x-p.w/2-x0)*sx+p.w/2; p.y=pad+(p.y-p.h/2-y0)*sy+p.h/2; });
  }
  fit();
  for(k=0;k<260;k++){
    var moved=false;
    for(i=0;i<n;i++) for(j=i+1;j<n;j++){
      var A=P[i], B=P[j], ox=(A.w+B.w)/2+16-Math.abs(B.x-A.x), oy=(A.h+B.h)/2+26-Math.abs(B.y-A.y);
      if(ox>0 && oy>0){
        moved=true;
        if(oy<ox){ var s=(B.y>=A.y?1:-1)*oy/2; A.y-=s; B.y+=s; } else { var s2=(B.x>=A.x?1:-1)*ox/2; A.x-=s2; B.x+=s2; }
      }
    }
    P.forEach(function(p){ p.x=Math.min(W-p.w/2-8,Math.max(p.w/2+8,p.x)); p.y=Math.min(H-p.h/2-8,Math.max(p.h/2+8,p.y)); });
    if(!moved) break;
  }
  return {P:P,E:E};
}
function edgePoint(a,b,toward){
  var dx=b.x-a.x, dy=b.y-a.y, hw=a.w/2, hh=a.h/2;
  var s=Math.min(dx!==0?hw/Math.abs(dx):1e9, dy!==0?hh/Math.abs(dy):1e9);
  return {x:a.x+dx*s, y:a.y+dy*s};
}
function drawMap(svg, nodes, edges, capId, title){
  var W=1100,H=720, L=layout(nodes,edges,W,H), P=L.P, out='<defs><marker id="ar-'+capId+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z"/></marker></defs>';
  var lab='';
  L.E.forEach(function(e){
    var a=P[e[0]], b=P[e[1]], p1=edgePoint(a,b), p2=edgePoint(b,a);
    out+='<line class="edge" x1="'+p1.x.toFixed(1)+'" y1="'+p1.y.toFixed(1)+'" x2="'+p2.x.toFixed(1)+'" y2="'+p2.y.toFixed(1)+'" marker-end="url(#ar-'+capId+')"/>';
    lab+='<text class="elabel" x="'+((p1.x+p2.x)/2).toFixed(1)+'" y="'+(((p1.y+p2.y)/2)+3.5).toFixed(1)+'">'+esc(e[2])+'</text>';
  });
  out+=lab;
  P.forEach(function(p,i){
    out+='<g class="'+(p.deg>=4?'hub':'')+'"><rect class="nbox" x="'+(p.x-p.w/2).toFixed(1)+'" y="'+(p.y-p.h/2).toFixed(1)+'" width="'+p.w.toFixed(1)+'" height="'+p.h+'" rx="15"/><text class="ntxt" x="'+p.x.toFixed(1)+'" y="'+p.y.toFixed(1)+'">'+esc(nodes[i])+'</text></g>';
  });
  svg.innerHTML=out;
  var cap=document.getElementById(capId+"-cap");
  if(cap) cap.textContent=nodes.length+" concepts (maximum 30) · "+edges.length+" liens nommés · les concepts les plus reliés sont en violet";
}

  var el=e.target.closest&&e.target.closest(".ed"); if(!el) return;
  try{ var sel=window.getSelection(), nd=sel&&sel.anchorNode; var p=nd&&(nd.nodeType===1?nd:nd.parentNode); var h=p&&p.closest&&p.closest(".ph"); if(h) h.classList.remove("ph"); }catch(x){}
  clearTimeout(saveT);
  saveT=setTimeout(function(){ flash(lsSet("t:"+el.getAttribute("data-k"), el.innerHTML)); if(el.getAttribute("data-k")==="name") syncName(); },350);
});
main.addEventListener("keydown",function(e){
  if(e.key==="Enter" && e.target.classList && e.target.classList.contains("ed-line")) e.preventDefault();
});
main.addEventListener("paste",function(e){
  var el=e.target.closest&&e.target.closest(".ed"); if(!el) return;
  e.preventDefault();
  var t=(e.clipboardData||window.clipboardData).getData("text/plain");
  document.execCommand("insertText",false,t);
});
/* cases à cocher */
document.querySelectorAll("[data-ck]").forEach(function(c){
  c.checked = lsGet("c:"+c.getAttribute("data-ck"))==="1";
  c.addEventListener("change",function(){ flash(lsSet("c:"+c.getAttribute("data-ck"), c.checked?"1":"0")); markDue(); });
});
function markDue(){
  var today=new Date(); today.setHours(0,0,0,0);
  document.querySelectorAll(".due[data-due]").forEach(function(d){
    var done=d.closest("li").querySelector("[data-ck]").checked;
    var due=new Date(d.getAttribute("data-due")+"T00:00:00");
    var base=d.getAttribute("data-label")||d.textContent.replace(/ · .*/,"");
    d.setAttribute("data-label",base);
    var late=!done && due<today;
    d.textContent = base + (late?" · échéance passée":"");
    d.classList.toggle("late",late);
  });
}
markDue();

/* ---------- Photos ---------- */
function shrink(file,max,cb){
  var r=new FileReader();
  r.onload=function(){ var im=new Image(); im.onload=function(){
    var s=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement("canvas");
    c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height); cb(c.toDataURL("image/jpeg",0.8));
  }; im.onerror=function(){ cb(null); }; im.src=r.result; };
  r.onerror=function(){ cb(null); }; r.readAsDataURL(file);
}
main.addEventListener("change",function(e){
  var inp=e.target; if(inp.type!=="file") return;
  var slot=inp.closest("[data-photo]"); if(slot){
    var f=inp.files&&inp.files[0]; if(!f) return;
    shrink(f,520,function(d){ if(!d){ flash(false); return; } var ok=lsSet("p:"+slot.getAttribute("data-photo"),d); flash(ok);
      if(ok){ slot.querySelector(".frame").innerHTML='<img alt="Portrait du scientifique" src="'+d+'">'; if(!slot.querySelector("[data-rm]")){ var b=document.createElement("button"); b.type="button"; b.className="btn small danger"; b.setAttribute("data-rm","1"); b.textContent="Retirer"; slot.querySelector(".acts").appendChild(b);} } });
  }
});
main.addEventListener("click",function(e){
  var rm=e.target.closest&&e.target.closest("[data-rm]");
  if(rm){ var slot=rm.closest("[data-photo]"); try{ localStorage.removeItem("bio12:p:"+slot.getAttribute("data-photo")); }catch(x){} slot.querySelector(".frame").textContent="Photo à ajouter"; rm.remove(); flash(true); }
});

/* ---------- Collage ---------- */
var collage=[]; try{ collage=JSON.parse(lsGet("collage")||"[]")||[]; }catch(e){ collage=[]; }
function saveCollage(){ flash(lsSet("collage",JSON.stringify(collage))); }
function renderCollage(){
  var box=document.getElementById("collageBox");
  if(!collage.length){ box.innerHTML='<div class="empty"><strong>Aucune photo pour l\'instant.</strong><br>Appuie sur « Ajouter des photos », puis écris la date et ce que tu faisais sur chacune.</div>'; return; }
  box.innerHTML='<div class="collage">'+collage.map(function(c,i){
    return '<figure class="tile" style="margin:0 0 14px"><img alt="'+esc(c.desc||"Photo du cours")+'" src="'+c.img+'">'+
      '<input type="text" class="d" data-i="'+i+'" data-f="date" value="'+esc(c.date||"")+'" placeholder="Date (ex. 12 nov. 2026)" aria-label="Date de la photo">'+
      '<input type="text" data-i="'+i+'" data-f="desc" value="'+esc(c.desc||"")+'" placeholder="Ce que je faisais" aria-label="Description de la photo">'+
      '<button type="button" class="btn small danger rm" data-ci="'+i+'">Retirer la photo</button></figure>';
  }).join("")+'</div>';
}
document.getElementById("collageFile").addEventListener("change",function(e){
  var files=[].slice.call(e.target.files||[]), pending=files.length; if(!pending) return;
  files.forEach(function(f){ shrink(f,900,function(d){
    if(d) collage.push({img:d,date:"",desc:""});
    if(--pending===0){ renderCollage(); saveCollage(); }
  }); });
  e.target.value="";
});
document.getElementById("collageBox").addEventListener("input",function(e){
  var t=e.target; if(t.getAttribute&&t.getAttribute("data-f")){ collage[+t.getAttribute("data-i")][t.getAttribute("data-f")]=t.value; clearTimeout(saveT); saveT=setTimeout(saveCollage,400); }
});
document.getElementById("collageBox").addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-ci]"); if(!b) return;
  collage.splice(+b.getAttribute("data-ci"),1); renderCollage(); saveCollage();
});
renderCollage();

/* ---------- Navigation active ---------- */
if("IntersectionObserver" in window){
  var links={}; document.querySelectorAll("[data-nav]").forEach(function(a){ links[a.getAttribute("data-nav")]=a; });
  var io=new IntersectionObserver(function(es){ es.forEach(function(en){ if(en.isIntersecting){ Object.keys(links).forEach(function(k){ links[k].classList.toggle("on",k===en.target.id); }); } }); },{rootMargin:"-30% 0px -60% 0px"});
  NAV.forEach(function(n){ var s=document.getElementById(n[0]); if(s) io.observe(s); });
}

setEditing(false);
syncName();
if(!storageOK) statusEl.textContent="Enregistrement indisponible dans ce navigateur";
})();
</script>
